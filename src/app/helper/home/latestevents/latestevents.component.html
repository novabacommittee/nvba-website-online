<!-- ═══════════════════ UPCOMING EVENTS ═══════════════════ -->
<section class="ev-upcoming">
  <div class="ev-container">

    <div class="ev-section-header">
      <span class="ev-section-header__tag">What's On</span>
      <h2 class="ev-section-header__title">Upcoming Events</h2>
      <div class="ev-section-header__divider"></div>
    </div>

    <div class="ev-grid">
      <ng-container *ngFor="let event of commingevents">
        <div class="ev-card" *ngIf="event.eventType=='current'">
          <a href="{{event.pageLink}}" class="ev-card__image" style="background-image: url({{event.eventImage}});">
            <span class="ev-card__date-badge">{{ event.eventDate }}</span>
          </a>
          <div class="ev-card__body">
            <h3 class="ev-card__title">
              <a href="{{event.pageLink}}">{{ event.eventName }}</a>
            </h3>
            <div class="ev-card__meta">
              <span class="ev-card__meta-row">
                <img src="./../../../../assets/images/icons/clock-icon.png" alt="time" class="ev-card__meta-icon">
                {{ event.timming }}
              </span>
              <a href="{{event.mapUrl}}" target="_blank" class="ev-card__meta-row ev-card__meta-row--link">
                <img src="./../../../../assets/images/icons/map-icon.png" alt="location" class="ev-card__meta-icon">
                {{ event.venue }}
              </a>
            </div>
            <a *ngIf="event.pageLink != '/'" href="{{event.pageLink}}" class="ev-card__cta">
              View Details &rarr;
            </a>
          </div>
        </div>
      </ng-container>
    </div>

  </div>
</section>

<!-- ═══════════════════ PAST EVENTS ═══════════════════ -->
<section class="ev-past">
  <div class="ev-container">

    <div class="ev-past__toggle-row">
      <button class="ev-past__toggle-btn" (click)="togglePastEvents()">
        Past Events
        <span class="ev-past__chevron" [class.ev-past__chevron--up]="pastEventsExpanded">&#9660;</span>
      </button>
    </div>

    <div class="ev-past__body" [ngClass]="{'ev-past__body--collapsed': !pastEventsExpanded}">

      <!-- Year tabs -->
      <div class="ev-year-tabs">
        <button
          class="ev-year-tab"
          *ngFor="let year of getYearKeys()"
          (click)="selectYear(year)"
          [ngClass]="{'ev-year-tab--active': selectedYear === year}">
          {{ year }}
        </button>
      </div>

      <!-- Past event cards for selected year -->
      <div class="ev-grid" [ngClass]="{'ev-past__body--collapsed': !selectedYear}">
        <ng-container *ngFor="let pevent of pastEventsByYear[selectedYear]">
          <div class="ev-card" *ngIf="pevent.eventType=='past'">
            <a href="{{pevent.pageLink}}" class="ev-card__image" style="background-image: url({{pevent.eventImage}});">
              <span class="ev-card__date-badge">{{ pevent.eventDate }}</span>
            </a>
            <div class="ev-card__body">
              <h3 class="ev-card__title">
                <a href="{{pevent.pageLink}}">{{ pevent.eventName }}</a>
              </h3>
              <div class="ev-card__meta">
                <span class="ev-card__meta-row">
                  <img src="./../../../../assets/images/icons/clock-icon.png" alt="time" class="ev-card__meta-icon">
                  {{ pevent.timming }}
                </span>
                <a href="{{pevent.mapUrl}}" target="_blank" class="ev-card__meta-row ev-card__meta-row--link">
                  <img src="./../../../../assets/images/icons/map-icon.png" alt="location" class="ev-card__meta-icon">
                  {{ pevent.venue }}
                </a>
              </div>
              <a *ngIf="pevent.pageLink != '/'" href="{{pevent.pageLink}}" class="ev-card__cta">
                View Details &rarr;
              </a>
            </div>
          </div>
        </ng-container>
      </div>

    </div>
  </div>
</section>
