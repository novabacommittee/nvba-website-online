<div class="wrapper" >
    <div class="container p-5 " >
        <div class="displayTable">
            <div class="displayTableCell text-center row d-flex mb-5">
            <div class="authBlock col-md-6 align-content-center p-5 ">
                <h3>Log In</h3>
                <form (ngSubmit)="authService.SignIn(userName.value, userPassword.value)">
                <div class="formGroup form-group">
                <input type="text" class="formControl form-control" placeholder="Email" #userName required>
                </div>
                <div class="formGroup form-group">
                <input type="password" class="formControl form-control" placeholder="Password" #userPassword required>
                </div>
                <!-- Calling SignIn Api from AuthService -->
                <div class="formGroup form-group">
                <input type="submit" class="btn btnPrimary" value="Log in">
                </div>
                </form>
                <div class="formGroup form-group">
                <span class="or"><span class="orInner">Or</span></span>
                </div>
                <!-- Calling GoogleAuth Api from AuthService -->
                <div class="formGroup form-group">
                <button type="button" class="btn googleBtn" (click)="authService.GoogleAuth()">
                    <i class="fab fa-google-plus-g"></i>
                    Log in with Google
                </button>
                </div>
                <div class="forgotPassword ">
                <a routerLink="/forgot-password">Forgot Password?</a>
                </div>
            </div>
            <div class="redirectToLogin">
                <span>Don't have an account?<a class="redirect" routerLink="/register-user"> Sign Up</a></span>
            </div>
            </div>
        </div>
    </div>  
</div>
