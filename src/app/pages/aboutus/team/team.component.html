<div class="team-page">

  <!-- ========== HERO ========== -->
  <section class="team-hero">
    <div class="team-hero__overlay"></div>
    <div class="team-hero__content">
      <nav class="team-hero__breadcrumb">
        <a routerLink="/">Home</a>
        <span class="team-hero__breadcrumb-sep">/</span>
        <span>About Us</span>
        <span class="team-hero__breadcrumb-sep">/</span>
        <span>Team</span>
      </nav>
      <p class="team-hero__eyebrow">NVBA</p>
      <h1 class="team-hero__title">Executive Committee</h1>
      <p class="team-hero__subtitle">Meet the team behind NVBA</p>
    </div>
  </section>

  <!-- ========== TEAM GRID ========== -->
  <section class="team-members">
    <div class="team-section-header team-section-header--center">
      <span class="team-section-header__tag">Our Team</span>
      <h2 class="team-section-header__title">Executive Committee Members</h2>
      <div class="team-section-header__divider"></div>
    </div>

    <div class="team-members__grid">
      <div class="team-card" *ngFor="let member of nvbaTeam">
        <div class="team-card__photo" [style.background-image]="'url(' + member.img_url + ')'"></div>
        <div class="team-card__body">
          <h3 class="team-card__name">{{ member.display_name }}</h3>
          <p class="team-card__role" *ngIf="member.designation">{{ member.designation }}</p>
          <div class="team-card__contact" *ngIf="member.facebook || member.email">
            <img width="16" height="16" src="./../../../../assets/images/ecm/Email_Icon.png" alt="email">
            <span>{{ member.facebook ? member.facebook : member.email }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
<app-sponsers></app-sponsers>
