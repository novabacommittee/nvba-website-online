<div class="wrapper" >

    <section class="ftco-section bg-light">
        <div class="container">
        <div class="row">

            <div class="col-lg-4 d-flex mb-sm-4 ftco-animate " *ngFor="let member of nvbaTeam" >
                <div class="staff">
                    <div class="d-flex mb-4">
                        <div class="img" style="background-image: url({{member.img_url}});"></div>
                        <div class="info ml-4">
                            <h3>{{member.display_name}}</h3>
                            <div class="position text mb-3">
                                <p>{{member.designation}}</p>
                                <img class="text-center" width="20" height="20" src="./../../../../assets/images/ecm/Email_Icon.png " >
                                <p *ngIf="member.facebook?member.facebook:member.email" style="font-size: 14px; word-wrap: break-word; margin: 0; padding: 0;">{{member.facebook?member.facebook:member.email}}</p>
                            </div>
                            <!-- <div class="text">
                                <p *ngIf="member.facebook?member.facebook:member.linkedin" ><a target="_blank" href="{{member.facebook?member.facebook:member.linkedin}}">Social link to connect</a></p>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>

        </div>

        </div>
    </section>
</div>
<app-sponsers></app-sponsers>
