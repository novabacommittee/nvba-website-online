<div class="bod-page">

  <!-- ========== HERO ========== -->
  <section class="bod-hero">
    <div class="bod-hero__overlay"></div>
    <div class="bod-hero__content">
      <nav class="bod-hero__breadcrumb">
        <a routerLink="/">Home</a>
        <span class="bod-hero__breadcrumb-sep">/</span>
        <span>About Us</span>
        <span class="bod-hero__breadcrumb-sep">/</span>
        <span>Board of Directors</span>
      </nav>
      <p class="bod-hero__eyebrow">NVBA</p>
      <h1 class="bod-hero__title">Board of Directors</h1>
      <p class="bod-hero__subtitle">Guiding NVBA with vision and leadership</p>
    </div>
  </section>

  <!-- ========== BOD GRID ========== -->
  <section class="bod-members">
    <div class="bod-section-header bod-section-header--center">
      <span class="bod-section-header__tag">Leadership</span>
      <h2 class="bod-section-header__title">Current Board of Directors</h2>
      <div class="bod-section-header__divider"></div>
    </div>

    <div class="bod-members__grid">
      <div class="bod-card" *ngFor="let member of nvbaTeam">
        <div class="bod-card__photo">
          <img [src]="member.img_url" [alt]="member.display_name" class="bod-card__img">
        </div>
        <div class="bod-card__body">
          <h3 class="bod-card__name">{{ member.display_name }}</h3>
          <div class="bod-card__contact" *ngIf="member.facebook || member.email">
            <img width="16" height="16" src="./../../../../assets/images/ecm/Email_Icon.png" alt="email">
            <span>{{ member.facebook ? member.facebook : member.email }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
<app-sponsers></app-sponsers>
